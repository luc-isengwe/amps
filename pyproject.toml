[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amps"
version = "0.5.0"
description = "Agent Manifest -> Policy Synthesis: minimal enforcement policies for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "networkx>=3.2",
    # PuLP 3.x no longer bundles the CBC solver; 2.9.0 does. Pinned for reproducibility.
    "pulp==2.9.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
amps = "amps.cli:main"

[tool.setuptools.packages.find]
include = ["amps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
